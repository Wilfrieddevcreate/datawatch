<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DataWatch — visuels Play Store</title>
<style>
  @font-face { font-family: 'Bricolage'; src: url('/assets/fonts/BricolageGrotesque.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/assets/fonts/Geist.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'GeistMono'; src: url('/assets/fonts/GeistMono.ttf'); font-weight: 100 900; }

  :root {
    --ink: #0B0D11; --text: #F2F4F7; --muted: #A7AFBD; --lime: #C6F135;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); overflow: hidden; }
  body { font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }

  #canvas { position: relative; overflow: hidden; background: var(--ink); color: var(--text); }
  #canvas.lime { background: var(--lime); color: #0F1218; }
  .abs { position: absolute; }

  /* Ambiance, comme dans la vidéo : lueur, grille de points, grain. */
  .glow { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(198,241,53,0.16) 0%, rgba(198,241,53,0.05) 38%, transparent 66%); }
  .lime .glow { background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.12) 40%, transparent 66%); }
  .grid { position: absolute; inset: -40px;
    background-image: radial-gradient(rgba(255,255,255,0.07) 1.6px, transparent 2.2px);
    background-size: 38px 38px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 35%, black 25%, transparent 75%); }
  .lime .grid { background-image: radial-gradient(rgba(15,18,24,0.10) 1.6px, transparent 2.2px); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* Typographie */
  .over { font-family: 'GeistMono', monospace; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--lime); }
  .lime .over { color: rgba(15,18,24,0.62); }
  .h { font-family: 'Bricolage', sans-serif; font-weight: 760; letter-spacing: -0.036em; line-height: 1; }
  .h em { font-style: normal; color: var(--lime); }

  /* Téléphone : cadre, écran, barre d'état, caméra. Taille en variables. */
  .phone { position: absolute; width: var(--w); height: var(--hgt); border-radius: calc(var(--w) * 0.128); background: #1A1E27;
    box-shadow: 0 0 0 calc(var(--w) * 0.003) #2E3442 inset, 0 calc(var(--w) * 0.08) calc(var(--w) * 0.16) rgba(0,0,0,0.5), 0 calc(var(--w) * 0.025) calc(var(--w) * 0.05) rgba(0,0,0,0.3); }
  .lime .phone { box-shadow: 0 0 0 calc(var(--w) * 0.003) #2E3442 inset, 0 calc(var(--w) * 0.08) calc(var(--w) * 0.16) rgba(40,60,0,0.35), 0 calc(var(--w) * 0.025) calc(var(--w) * 0.05) rgba(40,60,0,0.25); }
  .phone::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 30%, transparent 70%, rgba(255,255,255,0.05)); }
  .screen { position: absolute; left: var(--b); top: var(--b); right: var(--b); bottom: var(--b); border-radius: calc(var(--w) * 0.11); overflow: hidden; background: #EEF0F3; }
  .screen img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--s) * 28px); padding: 0 calc(var(--s) * 24px);
    display: flex; justify-content: space-between; align-items: center; z-index: 5;
    font-family: 'Geist', sans-serif; font-size: calc(var(--s) * 13px); font-weight: 600; color: #0F1218; }
  .status.dark { color: #F2F4F7; }
  .status .icons { display: flex; gap: calc(var(--s) * 5px); align-items: center; }
  .status svg { height: calc(var(--s) * 11px); width: auto; }
  .cam { position: absolute; top: calc(var(--s) * 8px); left: 50%; width: calc(var(--s) * 11px); height: calc(var(--s) * 11px);
    transform: translateX(-50%); border-radius: 50%; background: #0B0D11; z-index: 6; }

  /* Repère posé sur l'écran */
  .pill { position: absolute; display: flex; align-items: center; gap: 16px; padding: 18px 30px 18px 24px; border-radius: 999px;
    background: #1C212B; border: 2px solid #2E3442; color: var(--text); font-size: 32px; font-weight: 600; white-space: nowrap; z-index: 10;
    box-shadow: 0 24px 48px rgba(0,0,0,0.45); }
  .pill i { width: 16px; height: 16px; border-radius: 50%; background: var(--lime); display: block; }
  .lime .pill { background: #0F1218; border-color: #0F1218; }
</style>
</head>
<body>
<div id="canvas"></div>
<script>
// Écrans capturés par tool/store/capture_test.dart : 360 dp de large, densité 3.
const SCREEN_DP = 360;

// Captures pour téléphone, 1 080 × 1 920 (9:16, recommandé par Google Play).
const SHOTS = [
  { id: '01-forfait', screen: 'home', over: 'Suivi data mobile',
    title: ['Ce qu’il vous reste,', '<em>d’un coup d’œil.</em>'], pill: 'Restant · rythme · expiration' },
  { id: '02-applications', screen: 'apps', over: 'Applications',
    title: ['Voyez quelles applis', '<em>vident le forfait.</em>'], pill: 'Données mobiles et Wi-Fi séparées' },
  { id: '03-temps-ecran', screen: 'detail', over: 'Temps d’écran',
    title: ['Le vrai coût', 'd’<em>une heure</em> d’appli.'], pill: 'Données ÷ temps passé dessus' },
  { id: '04-alertes', screen: 'plan', offset: 812, over: 'Alertes',
    title: ['Prévenu', '<em>tous les 20 %.</em>'], pill: 'Même application fermée' },
  { id: '05-conseils', screen: 'tips', over: 'Conseils',
    title: ['Des gestes qui font', '<em>durer le forfait.</em>'], pill: 'Adaptés à vos applications' },
  { id: '06-mode-sombre', screen: 'home_dark', dark: true, theme: 'lime', over: 'Mode sombre',
    title: ['Confortable,', 'même la nuit.'], pill: 'Suit le thème du téléphone' },
  { id: '07-confidentialite', screen: 'privacy', over: 'Confidentialité',
    title: ['Rien ne quitte', '<em>votre téléphone.</em>'], pill: 'Sans compte · sans Internet · sans pub' },
];

const STATUS_ICONS = `
  <svg viewBox="0 0 18 14"><path d="M1 13h3V9H1zM6 13h3V6H6zM11 13h3V3h-3zM16 13h1V0h-1z" fill="currentColor"/></svg>
  <svg viewBox="0 0 24 18"><path d="M12 17.5l3.2-4a5 5 0 0 0-6.4 0zM3.5 7.5a12 12 0 0 1 17 0l-2.2 2.7a8.6 8.6 0 0 0-12.6 0zM0 3.6A17 17 0 0 1 24 3.6l-2.2 2.6a13.6 13.6 0 0 0-19.6 0z" fill="currentColor"/></svg>
  <svg viewBox="0 0 26 14"><rect x="0.75" y="0.75" width="21" height="12.5" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="3" width="13" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4.5" width="2" height="5" rx="1" fill="currentColor"/></svg>`;

// Téléphone de largeur w, coin haut-gauche (x, y), hauteur visible h.
function phone({ screen, x, y, w, h, offset = 0, dark = false, extra = '' }) {
  const bezel = Math.round(w * 0.018);
  const inner = w - 2 * bezel;
  const s = inner / SCREEN_DP;
  const bg = dark ? '#0B0D11' : '#EEF0F3';
  // Écran défilé : la barre d'état garde le fond de l'application.
  const statusBg = offset > 0 ? `<div class="abs" style="left:0; right:0; top:0; height:${36 * s}px; background:${bg}; z-index:4"></div>` : '';
  return `
    <div class="phone" style="left:${x}px; top:${y}px; --w:${w}px; --hgt:${h}px; --b:${bezel}px; --s:${s}; ${extra}">
      <div class="screen" style="background:${bg}">
        <img src="/tool/store/assets/screens/${screen}.png" style="top:${-offset * s}px">
        ${statusBg}
        <div class="status${dark ? ' dark' : ''}"><span>14:26</span><span class="icons">${STATUS_ICONS}</span></div>
        <div class="cam"></div>
      </div>
    </div>`;
}

const ambiance = (glow) => `
  <div class="glow" style="${glow}"></div>
  <div class="grid"></div>`;

function screenshot(shot) {
  const lines = shot.title.map(l => `<div>${l}</div>`).join('');
  return {
    width: 1080, height: 1920, theme: shot.theme,
    html: `
      ${ambiance('left:180px; top:240px; width:1400px; height:1400px')}
      <div class="abs" style="left:96px; top:128px; right:80px">
        <div class="over" style="font-size:28px">${shot.over}</div>
        <div class="h" style="font-size:94px; margin-top:30px">${lines}</div>
        <div class="pill" style="position:relative; display:inline-flex; margin-top:40px"><i></i><span>${shot.pill}</span></div>
      </div>
      ${phone({ screen: shot.screen, x: 150, y: 600, w: 780, h: 1560, offset: shot.offset, dark: shot.dark })}
      <div class="grain"></div>`,
  };
}

// Bannière de la fiche, 1 024 × 500.
function featureGraphic() {
  return {
    width: 1024, height: 500,
    html: `
      ${ambiance('left:420px; top:-520px; width:1100px; height:1100px')}
      <div class="abs" style="left:64px; top:78px; display:flex; align-items:center; gap:16px">
        <svg width="30" height="52" viewBox="0 0 160 280">
          <rect x="10" y="10" width="140" height="260" rx="46" fill="#2A303C"/>
          <path d="M28 140 h104 a6 6 0 0 1 6 6 v68 a40 40 0 0 1 -40 40 h-32 a40 40 0 0 1 -40 -40 v-68 a6 6 0 0 1 6 -6z" fill="#C6F135"/>
        </svg>
        <div class="h" style="font-size:36px">DataWatch</div>
      </div>
      <div class="abs h" style="left:64px; top:180px; font-size:54px; line-height:1.04">
        <div>Sachez où partent</div>
        <div><em>vos données mobiles.</em></div>
      </div>
      <div class="abs over" style="left:66px; top:350px; font-size:17px; color:var(--muted)">Par appli · alertes · 100 % local</div>
      ${phone({ screen: 'apps', x: 806, y: 118, w: 220, h: 520, extra: 'transform: rotate(7deg); transform-origin: top left;' })}
      ${phone({ screen: 'home', x: 652, y: 62, w: 246, h: 560 })}
      <div class="grain"></div>`,
  };
}

const VISUALS = [
  { id: 'feature-graphic', build: featureGraphic },
  ...SHOTS.map(s => ({ id: `screenshots/${s.id}`, build: () => screenshot(s) })),
];
window.VISUALS = VISUALS.map(v => v.id);

// Monte un visuel et attend polices et images ; renvoie sa taille.
window.show = async (id) => {
  const v = VISUALS.find(x => x.id === id).build();
  const canvas = document.getElementById('canvas');
  canvas.className = v.theme ?? '';
  canvas.style.width = `${v.width}px`;
  canvas.style.height = `${v.height}px`;
  canvas.innerHTML = v.html;
  await document.fonts.ready;
  await Promise.all([...canvas.querySelectorAll('img')].map(img => img.decode()));
  return { width: v.width, height: v.height };
};
</script>
</body>
</html>
